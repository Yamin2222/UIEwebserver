<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>400 - 错误的请求</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 50px 30px;
        }
        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #FF5252;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 20px;
            color: #444;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            padding: 12px 24px;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #0E42D2;
            transform: translateY(-1px);
        }
        .details {
            color: #666;
            margin-top: 30px;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">400</div>
        <div class="error-message">
            错误的请求
        </div>
        <p>服务器无法理解您的请求，请检查提交的数据是否正确。</p>
        <a href="/index.html" class="btn">返回首页</a>
        <div class="details">
            <p>可能的原因：</p>
            <ul style="list-style-type: none; margin-top: 10px;">
                <li>• 上传的文件格式不受支持</li>
                <li>• 请求参数不完整或无效</li>
                <li>• 数据格式错误</li>
            </ul>
        </div>
    </div>
</body>
</html>
