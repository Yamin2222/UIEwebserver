<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>LPGPNet水下图像增强工具</title>
    <style>
        /* 保持原有CSS样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #165DFF;
            margin: 20px 0 30px;
            font-weight: 600;
        }
        .upload-section {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 30px;
            margin-bottom: 30px;
        }
        .upload-area {
            text-align: center;
            padding: 40px 20px;
            border: 2px dashed #165DFF;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #0E42D2;
            background-color: #f0f7ff;
        }
        #fileInput {
            display: none;
        }
        .btn {
            padding: 12px 24px;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
        }
        .btn:hover {
            background: #0E42D2;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(1px);
        }
        .btn:disabled {
            background: #86ADFF;
            cursor: not-allowed;
            transform: none;
        }
        .btn-download {
            background: #36D399;
        }
        .btn-download:hover {
            background: #28A745;
        }
        .btn-download:disabled {
            background: #87E8DE;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        #fileInfo {
            text-align: center;
            color: #666;
            font-size: 14px;
            padding: 10px;
        }
        .preview-container {
            display: flex;
            justify-content: space-around;
            margin-top: 30px;
            flex-wrap: wrap;
            gap: 30px;
        }
        .preview-box {
            text-align: center;
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .preview-box h3 {
            color: #444;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
        .preview-content {
            min-height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #eee;
            border-radius: 6px;
            overflow: hidden;
            background-color: #fafafa;
            position: relative;
        }
        .loading-indicator {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #165DFF;
            display: none;
        }
        .preview-img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        #originalVideo, #enhancedVideo {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }
        .error-message {
            color: #ff4d4f;
            text-align: center;
            margin-top: 10px;
            min-height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>LPGPNet水下图像/视频增强工具</h1>
        
        <div class="upload-section">
            <div class="upload-area">
                <label for="fileInput" class="btn">选择文件</label>
                <input type="file" id="fileInput" accept="image/*">
                <p id="fileInfo">未选择文件</p>
                <p id="errorMessage" class="error-message"></p>
            </div>
            
            <div class="button-group">
                <button class="btn" id="enhanceBtn">增强</button>
                <button class="btn btn-download" id="mainDownloadBtn" disabled>下载结果</button>
            </div>
        </div>

        <div class="preview-container">
            <div class="preview-box">
                <h3>原图</h3>
                <div class="preview-content">
                    <div class="loading-indicator" id="originalLoading">加载中...</div>
                    <img id="originalImg" class="preview-img" style="display: none;">
                    <video id="originalVideo" controls style="display: none;"></video>
                </div>
            </div>
            <div class="preview-box">
                <h3>增强后</h3>
                <div class="preview-content">
                    <div class="loading-indicator" id="enhancedLoading">处理中...</div>
                    <img id="enhancedImg" class="preview-img" style="display: none;">
                    <video id="enhancedVideo" controls style="display: none;"></video>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 等待DOM完全加载
        document.addEventListener('DOMContentLoaded', function() {
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const errorMessage = document.getElementById('errorMessage');
            const originalImg = document.getElementById('originalImg');
            const originalVideo = document.getElementById('originalVideo');
            const originalLoading = document.getElementById('originalLoading');
            const enhancedImg = document.getElementById('enhancedImg');
            const enhancedVideo = document.getElementById('enhancedVideo');
            const enhancedLoading = document.getElementById('enhancedLoading');
            const enhanceBtn = document.getElementById('enhanceBtn');
            const mainDownloadBtn = document.getElementById('mainDownloadBtn');
            
            let currentFile = null;
            let originalFileUrl = null;
            let enhancedFileUrl = null;

            // 选择文件后预览
            fileInput.addEventListener('change', (e) => {
                // 重置错误消息
                errorMessage.textContent = '';
                
                if (e.target.files.length === 0) {
                    currentFile = null;
                    fileInfo.textContent = '未选择文件';
                    hideAllPreviews();
                    return;
                }
                
                currentFile = e.target.files[0];
                fileInfo.textContent = `已选择: ${currentFile.name} (${formatFileSize(currentFile.size)})`;
                
                // 隐藏所有预览
                hideAllPreviews();
                
                // 显示原图
                if (currentFile.type.startsWith('image/')) {
                    originalLoading.style.display = 'flex';
                    
                    // 释放之前的URL
                    if (originalFileUrl) {
                        URL.revokeObjectURL(originalFileUrl);
                    }
                    
                    originalFileUrl = URL.createObjectURL(currentFile);
                    originalImg.src = originalFileUrl;
                    
                    // 图像加载完成后显示
                    originalImg.onload = function() {
                        originalLoading.style.display = 'none';
                        originalImg.style.display = 'block';
                    };
                    
                    // 图像加载失败处理
                    originalImg.onerror = function() {
                        originalLoading.style.display = 'none';
                        errorMessage.textContent = '图像加载失败，请尝试其他图片';
                        currentFile = null;
                        fileInfo.textContent = '未选择文件';
                    };
                } else {
                    alert('暂不支持视频，请选择图像文件（如JPG、PNG）');
                    currentFile = null;
                    fileInfo.textContent = '未选择文件';
                }
            });

            // 增强按钮点击事件
            enhanceBtn.addEventListener('click', async () => {
                if (!currentFile) {
                    errorMessage.textContent = '请先选择图像文件';
                    return;
                }

                // 显示加载状态
                enhanceBtn.disabled = true;
                enhanceBtn.textContent = '增强中...';
                mainDownloadBtn.disabled = true;
                errorMessage.textContent = '';
                enhancedLoading.style.display = 'flex';
                hideEnhancedPreview();

                try {
                    // 创建FormData，包装要上传的文件
                    const formData = new FormData();
                    formData.append('file', currentFile);
                    
                    console.log('准备上传文件:', currentFile);
                    
                    // 发送POST请求到后端
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData,
                        // 不手动设置Content-Type，让浏览器自动处理multipart/form-data
                    });

                    console.log('服务器响应状态:', response.status);
                    
                    // 校验响应状态
                    if (!response.ok) {
                        // 尝试获取服务器返回的错误信息
                        let errorText = '';
                        try {
                            errorText = await response.text();
                        } catch (e) {
                            errorText = `HTTP错误: ${response.status}`;
                        }
                        throw new Error(errorText);
                    }

                    // 处理后端返回的增强后图像
                    const enhancedBlob = await response.blob();
                    console.log('收到增强后的图像，类型:', enhancedBlob.type);
                    
                    // 释放之前的URL
                    if (enhancedFileUrl) {
                        URL.revokeObjectURL(enhancedFileUrl);
                    }
                    
                    enhancedFileUrl = URL.createObjectURL(enhancedBlob);
                    enhancedImg.src = enhancedFileUrl;
                    
                    // 增强图像加载完成后显示
                    enhancedImg.onload = function() {
                        enhancedLoading.style.display = 'none';
                        enhancedImg.style.display = 'block';
                        mainDownloadBtn.disabled = false;
                    };
                    
                    // 增强图像加载失败处理
                    enhancedImg.onerror = function() {
                        throw new Error('增强后的图像加载失败');
                    };

                } catch (err) {
                    // 错误处理
                    console.error('增强过程出错:', err);
                    errorMessage.textContent = `增强失败: ${err.message}`;
                    enhancedLoading.style.display = 'none';
                } finally {
                    // 恢复按钮状态
                    enhanceBtn.disabled = false;
                    enhanceBtn.textContent = '增强';
                }
            });

            // 下载按钮点击事件
            mainDownloadBtn.addEventListener('click', () => {
                if (!enhancedFileUrl || !currentFile) return;

                // 生成增强后的文件名
                const originalName = currentFile.name;
                const dotIndex = originalName.lastIndexOf('.');
                const fileName = dotIndex !== -1 
                    ? `${originalName.substring(0, dotIndex)}_enhanced${originalName.substring(dotIndex)}`
                    : `${originalName}_enhanced`;

                // 创建临时下载链接并触发点击
                const a = document.createElement('a');
                a.href = enhancedFileUrl;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                
                // 清理
                setTimeout(() => {
                    document.body.removeChild(a);
                }, 100);
            });

            // 工具函数：格式化文件大小
            function formatFileSize(bytes) {
                if (bytes < 1024) return `${bytes} B`;
                if (bytes < 1048576) return `${(bytes / 1024).toFixed(1)} KB`;
                return `${(bytes / 1048576).toFixed(1)} MB`;
            }

            // 工具函数：隐藏所有预览
            function hideAllPreviews() {
                originalImg.style.display = 'none';
                originalVideo.style.display = 'none';
                hideEnhancedPreview();
            }

            // 工具函数：隐藏增强后的预览
            function hideEnhancedPreview() {
                enhancedImg.style.display = 'none';
                enhancedVideo.style.display = 'none';
            }

            // 页面卸载时释放URL，避免内存泄漏
            window.addEventListener('beforeunload', () => {
                if (originalFileUrl) URL.revokeObjectURL(originalFileUrl);
                if (enhancedFileUrl) URL.revokeObjectURL(enhancedFileUrl);
            });
        });
    </script>
</body>
</html>
