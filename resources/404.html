<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>404 - 页面未找到</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
            padding: 50px 30px;
        }
        .error-code {
            font-size: 80px;
            font-weight: 700;
            color: #FF9800;
            margin-bottom: 20px;
        }
        .error-message {
            font-size: 20px;
            color: #444;
            margin-bottom: 30px;
        }
        .btn {
            padding: 12px 24px;
            background: #165DFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #0E42D2;
            transform: translateY(-1px);
        }
        .details {
            color: #666;
            margin-top: 30px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <div class="error-message">
            页面未找到
        </div>
        <p>您请求的页面不存在或已被移动。</p>
        <a href="/index.html" class="btn">返回首页</a>
        <div class="details">
            <p>请检查您输入的URL是否正确，或点击上方按钮返回工具首页。</p>
        </div>
    </div>
</body>
</html>
